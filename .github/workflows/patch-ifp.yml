name: Patch IFP with rwfury

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install rwfury
        run: pip install rwfury
      
      - name: Fix header and remove animations
        run: |
          python -c "
          import os
          import struct
          from rwfury import Ifp
          
          with open('input/python.ifp', 'rb') as f:
              data = bytearray(f.read())
          
          print(f'Size: {len(data)}')
          print(f'Header: {data[:12]}')
          
          # Заменяем ANP3PYTHON на ANP3 (4 байта) + нули
          if data[:12] == b'ANP3PYTHON\x00\x00\x00\x00':
              data[:4] = b'ANP3'
              data[4:12] = b'\x00' * 8
              print('Fixed header to ANP3')
          
          # Проверяем что получилось
          print(f'New header: {data[:12]}')
          
          # Сохраняем фикс-файл
          with open('input/python_fixed.ifp', 'wb') as f:
              f.write(data)
          
          # Пробуем через rwfury
          ifp = Ifp.from_file('input/python_fixed.ifp')
          print(f'Animations: {list(ifp.animations.keys())}')
          
          # Удаляем
          ifp.remove_animation('python_reload')
          ifp.remove_animation('python_crouchreload')
          print('Removed!')
          
          os.makedirs('output', exist_ok=True)
          ifp.to_file('output/python_clean.ifp')
          print('Saved!')
          "
      
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: patched-ifp
          path: output/python_clean.ifp
