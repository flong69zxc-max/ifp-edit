name: Patch IFP with rwfury

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install rwfury
        run: pip install rwfury
      
      - name: Patch IFP
        run: |
          python -c "
          import os
          import struct
          from rwfury import Ifp
          
          # Читаем файл
          with open('input/python.ifp', 'rb') as f:
              data = bytearray(f.read())
          
          print(f'File size: {len(data)}')
          print(f'Current header: {data[:16].hex()}')
          
          # Исправляем размер в заголовке (байты 4-7)
          # Размер должен быть равен длине файла минус 12 байт (заголовок без размера)
          correct_size = len(data)
          print(f'Setting size to: {correct_size}')
          
          # Записываем правильный размер
          data[4:8] = struct.pack('<I', correct_size)
          
          print(f'New header: {data[:16].hex()}')
          
          # Сохраняем исправленный файл
          with open('input/fixed.ifp', 'wb') as f:
              f.write(data)
          
          # Пробуем загрузить через rwfury
          try:
              ifp = Ifp.from_file('input/fixed.ifp')
              print('Successfully loaded!')
              
              # Показываем список анимаций
              anims = list(ifp.animations.keys())
              print(f'Animations: {anims}')
              
              # Удаляем анимации
              removed = []
              for anim_name in ['python_reload', 'python_crouchreload']:
                  if anim_name in ifp.animations:
                      ifp.remove_animation(anim_name)
                      removed.append(anim_name)
                      print(f'Removed: {anim_name}')
                  else:
                      print(f'Not found: {anim_name}')
              
              if not removed:
                  print('No animations were removed. Creating clean copy anyway...')
              
              # Создаем output директорию
              os.makedirs('output', exist_ok=True)
              
              # Сохраняем результат
              ifp.to_file('output/python_clean.ifp')
              print('Saved to output/python_clean.ifp')
              
          except Exception as e:
              print(f'Error: {e}')
              
              # Альтернативный метод - если rwfury все еще не работает
              # Просто исправляем заголовок и сохраняем копию
              print('Trying alternative method...')
              
              # Убедимся, что размер в заголовке правильный
              fixed_data = bytearray(data)
              fixed_data[4:8] = struct.pack('<I', len(fixed_data))
              
              os.makedirs('output', exist_ok=True)
              with open('output/python_clean.ifp', 'wb') as f:
                  f.write(fixed_data)
              
              print('Saved fixed copy (without removing animations)')
              print('Animations were NOT removed due to rwfury error')
          "
      
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: patched-ifp
          path: output/python_clean.ifp
