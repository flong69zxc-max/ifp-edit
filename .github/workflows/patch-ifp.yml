name: Patch IFP with rwfury

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install rwfury
        run: pip install rwfury

      - name: Remove animations
        run: |
          python -c "
          import os
          from rwfury import Ifp
          
          # Пытаемся загрузить файл вручную
          with open('input/python.ifp', 'rb') as f:
              data = f.read()
              
          # Попытка обойти стандартную загрузку
          try:
              ifp = Ifp.from_bytes(data)
          except:
              # Если не получается, создаем новый файл с теми же данными
              ifp = Ifp()
              # Здесь нужна логика ручного парсинга
              
          # Удаляем анимации
          # ifp.remove_animation('python_reload')
          # ifp.remove_animation('python_crouchreload')
          
          # Сохраняем
          os.makedirs('output', exist_ok=True)
          ifp.to_file('output/python_clean.ifp')
          "

      - name: Upload patched file
        uses: actions/upload-artifact@v4
        with:
          name: patched-ifp
          path: output/python_clean.ifp
