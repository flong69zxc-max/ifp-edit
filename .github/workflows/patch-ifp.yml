name: Parse IFP

on:
  push:
    paths:
      - 'input/*.ifp'
  workflow_dispatch:

jobs:
  parse:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install build tools
        run: sudo apt-get install -y build-essential
      
      - name: Build parser
        run: make
      
      - name: Parse IFP
        run: |
          ./anim_parser input/python.ifp > output/python_parsed.txt
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: parsed-animation
          path: output/python_parsed.txt
