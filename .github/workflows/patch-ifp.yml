name: Patch IFP with rwfury

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install rwfury
        run: pip install rwfury
      
      - name: Fix header and patch
        run: |
          python -c "
          import os
          import struct
          from rwfury import Ifp
          
          # Читаем файл
          with open('input/python.ifp', 'rb') as f:
              data = bytearray(f.read())
          
          print(f'Original size: {len(data)}')
          
          # Проверяем сигнатуру
          signature = data[:4]
          print(f'Signature: {signature}')
          
          # Если сигнатура не ANP3, исправляем
          if signature != b'ANP3':
              # Создаем правильный заголовок
              # Сохраняем количество анимаций (если есть)
              if len(data) > 16:
                  anim_count = struct.unpack('<H', data[12:14])[0]
              else:
                  anim_count = 0
              
              print(f'Found anim count: {anim_count}')
              
              # Новый заголовок: ANP3 + размер всего файла + версия 3 + count + padding
              new_header = bytearray()
              new_header.extend(b'ANP3')
              new_header.extend(struct.pack('<I', len(data)))
              new_header.extend(struct.pack('<I', 3))  # версия 3
              new_header.extend(struct.pack('<H', anim_count))
              new_header.extend(b'\x00\x00')  # padding
              
              # Заменяем первые 16 байт
              if len(data) < 16:
                  data.extend(b'\x00' * (16 - len(data)))
              data[0:16] = new_header
              
              print(f'Fixed header: {data[:16].hex()}')
          else:
              print('Header already ANP3')
          
          # Сохраняем исправленный файл
          with open('input/python_fixed.ifp', 'wb') as f:
              f.write(data)
          
          # Пробуем загрузить через rwfury
          try:
              ifp = Ifp.from_file('input/python_fixed.ifp')
              print(f'Successfully loaded!')
              
              # Показываем список анимаций
              anims = list(ifp.animations.keys())
              print(f'Animations found: {anims}')
              
              # Удаляем анимации если они есть
              for anim_name in ['python_reload', 'python_crouchreload']:
                  if anim_name in ifp.animations:
                      ifp.remove_animation(anim_name)
                      print(f'Removed: {anim_name}')
                  else:
                      print(f'Animation not found: {anim_name}')
              
              # Создаем output директорию
              os.makedirs('output', exist_ok=True)
              
              # Сохраняем результат
              ifp.to_file('output/python_clean.ifp')
              print('Successfully saved to output/python_clean.ifp')
              
          except Exception as e:
              print(f'Error loading with rwfury: {e}')
              print('Trying alternative method...')
              
              # Альтернативный метод: парсим вручную и удаляем анимации
              # (если rwfury не может загрузить файл)
              with open('input/python_fixed.ifp', 'rb') as f:
                  data2 = bytearray(f.read())
              
              # Ваш код для ручного удаления анимаций здесь
              # ...
              
              print('Alternative method not implemented yet')
              raise
          "
      
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: patched-ifp
          path: output/python_clean.ifp
