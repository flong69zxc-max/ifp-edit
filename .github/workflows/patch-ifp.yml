name: Patch IFP - Remove Animations

on:
  push:
    paths:
      - 'input/python.ifp'
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Python dependencies
        run: |
          pip install numpy
      
      - name: Install ifp_editor
        run: |
          git clone https://github.com/gtamods/ifp_editor.git
          cd ifp_editor
          python setup.py install || true
      
      - name: Remove animations
        run: |
          python scripts/remove_anims.py
      
      - name: Upload patched file
        uses: actions/upload-artifact@v4
        with:
          name: patched-ifp
          path: output/python_clean.ifp
          retention-days: 30
