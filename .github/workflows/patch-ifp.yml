name: Parse IFP

on:
  push:
    paths:
      - 'input/python.ifp'
  workflow_dispatch:

jobs:
  parse:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download anim_parser
        run: |
          curl -L -o anim_parser.exe https://github.com/Daniel-Cortez/sa-anim-parser/releases/download/v1.0/anim_parser.exe
      
      - name: Parse IFP file
        run: |
          .\anim_parser.exe input\python.ifp > output\python_parsed.txt
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: parsed-animation
          path: output\python_parsed.txt
