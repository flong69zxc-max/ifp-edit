name: Patch IFP with rwfury

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install rwfury
        run: pip install rwfury
      
      - name: Fix header and patch
        run: |
          python -c "
          import os
          import struct
          from rwfury import Ifp
          
          # Читаем файл
          with open('input/python.ifp', 'rb') as f:
              data = bytearray(f.read())
          
          print(f'Size: {len(data)}')
          
          # Создаем правильный заголовок ANP3
          # ANP3 (4 байта) + размер (4 байта) + версия (4 байта) + количество (2 байта)
          new_header = bytearray()
          new_header.extend(b'ANP3')  # сигнатура
          new_header.extend(struct.pack('<I', len(data)))  # размер файла
          new_header.extend(struct.pack('<I', 3))  # версия 3 (ANP3)
          
          # Копируем количество анимаций из старого файла (байты 12-13)
          anim_count = struct.unpack('<H', data[12:14])[0]
          new_header.extend(struct.pack('<H', anim_count))  # количество
          new_header.extend(b'\x00\x00')  # padding
          
          # Заменяем заголовок (первые 16 байт)
          data[0:16] = new_header
          
          print(f'New header: {data[:16].hex()}')
          print(f'Anim count: {anim_count}')
          
          # Сохраняем исправленный файл
          with open('input/python_fixed.ifp', 'wb') as f:
              f.write(data)
          
          # Загружаем через rwfury
          ifp = Ifp.from_file('input/python_fixed.ifp')
          print(f'Loaded! Animations: {list(ifp.animations.keys())}')
          
          # Удаляем анимации
          ifp.remove_animation('python_reload')
          ifp.remove_animation('python_crouchreload')
          print('Removed!')
          
          os.makedirs('output', exist_ok=True)
          ifp.to_file('output/python_clean.ifp')
          print('Saved!')
          "
      
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: patched-ifp
          path: output/python_clean.ifp
